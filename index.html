<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Locora</title>
<style>
:root{--bg:#0f1720;--card:#17212d;--line:#263445;--text:#e8eef5;--muted:#8fa3b8;--accent:#3ea6ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;line-height:1.45}
header{border-bottom:1px solid var(--line);background:#0b1118;position:sticky;top:0;z-index:5}
.bar{max-width:980px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;color:#fff;text-decoration:none}
nav a{color:var(--muted);text-decoration:none;margin-right:16px;padding:6px 0;border-bottom:2px solid transparent}
nav a.on{color:#fff;border-color:var(--accent)}
.acct{margin-left:auto;font-size:13px;color:var(--muted)}
main{max-width:980px;margin:0 auto;padding:22px 20px 90px}
h1{margin:0 0 4px}
h2{margin:26px 0 10px;font-size:20px}
h3{margin:0;font-size:18px}
.sub,.muted{color:var(--muted)}
.notice{background:#1b2a3a;border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--muted);margin-bottom:18px}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 18px;min-width:110px}
.stat b{display:block;font-size:24px}
.stat span{color:var(--muted);font-size:13px}
.filters{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:block;color:inherit;text-decoration:none}
a.card:hover{border-color:var(--accent)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.meta{color:var(--muted);font-size:14px;margin:6px 0 0}
.badge{font-size:12px;padding:3px 10px;border-radius:999px;background:#33414f}
.Active,.Approved,.upheld{background:#1f6f43}
.Paused,.Pending{background:#8a6d1a}
.Completed{background:#1d4f8a}
.Rejected,.dismissed{background:#8a2f2f}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.fact small{display:block;color:var(--muted);margin-bottom:2px}
input,select,button{font:inherit;color:var(--text);background:#0d141c;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
input,select{width:100%}
.filters input,.filters select{width:auto;flex:1;min-width:160px}
button{cursor:pointer;background:#1c3a57;border-color:#2b5a85;width:auto}
button:hover{background:#245076}
button.small{padding:4px 10px;font-size:13px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.form label{font-size:13px;color:var(--muted);display:block}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.actions input{width:120px}
.hist{margin:0;padding-left:18px}
.hist li{margin-bottom:6px;color:#cfe0f0}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#0b1118;border:1px solid var(--accent);border-radius:10px;padding:10px 16px;max-width:90%;display:none;z-index:10}
#toast.err{border-color:#d9534f}
a.back{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="logo" href="#/">Locora</a>
    <nav id="nav"></nav>
    <div class="acct" id="acct"></div>
  </div>
</header>
<main id="main"></main>
<div id="toast"></div>

<script type="module">
import * as GL from "https://esm.sh/genlayer-js";
import { studionet, testnetBradbury } from "https://esm.sh/genlayer-js/chains";

/* ===== SETTINGS ===== */
// The contract address and the network must match.
// Studio contract:   NETWORK = "studionet"
// Bradbury contract: NETWORK = "testnetBradbury"  (and paste the new Bradbury address)
const CONTRACT = "0x2538d4f6c9C5CE5935889CB4B510D6f2a84f8342";
const NETWORK = "studionet";
const RPC_OVERRIDE = ""; // leave empty unless told otherwise
/* ==================== */

const baseChain = NETWORK === "studionet" ? studionet : testnetBradbury;
const chain = RPC_OVERRIDE
  ? { ...baseChain, rpcUrls: { default: { http: [RPC_OVERRIDE] } } }
  : baseChain;
const readClient = GL.createClient({ chain });
const WEI = 10n ** 18n;

/* ---------- GEN <-> wei ---------- */
function gen(w) {
  const b = BigInt(w || "0");
  const frac = (b % WEI).toString().padStart(18, "0").slice(0, 4).replace(/0+$/, "");
  return (b / WEI).toString() + (frac ? "." + frac : "") + " GEN";
}
function toWei(s) {
  s = String(s).trim();
  if (!/^\d*\.?\d+$/.test(s)) throw new Error("Enter a valid GEN amount, like 0.5");
  const [w, f = ""] = s.split(".");
  return BigInt(w || "0") * WEI + BigInt((f + "0".repeat(18)).slice(0, 18));
}

/* ---------- reading ---------- */
function plain(v) {
  if (typeof v === "bigint") return Number(v);
  if (v instanceof Map) { const o = {}; for (const [k, x] of v.entries()) o[k] = plain(x); return o; }
  if (Array.isArray(v)) return v.map(plain);
  if (v && typeof v === "object") { const o = {}; for (const k of Object.keys(v)) o[k] = plain(v[k]); return o; }
  return v;
}
async function read(fn, args = []) {
  return plain(await readClient.readContract({ address: CONTRACT, functionName: fn, args }));
}

/* ---------- wallet ---------- */
let walletClient = null, ME = "", balance = "";
async function updateBalance() {
  try {
    const hex = await window.ethereum.request({ method: "eth_getBalance", params: [ME, "latest"] });
    balance = gen(BigInt(hex).toString());
  } catch (_) { balance = ""; }
}
async function connectWallet(silent) {
  if (!window.ethereum) { if (!silent) toast("MetaMask was not found. Install MetaMask and reload this page.", true); return; }
  try {
    const accounts = await window.ethereum.request({ method: silent ? "eth_accounts" : "eth_requestAccounts" });
    if (!accounts.length) return;
    walletClient = GL.createClient({ chain, account: accounts[0], provider: window.ethereum });
    await walletClient.connect(NETWORK);
    ME = accounts[0].toLowerCase();
    await updateBalance();
  } catch (e) {
    walletClient = null; ME = "";
    if (!silent) toast("Could not connect: " + (e.shortMessage || e.message || e), true);
  }
  render();
}
if (window.ethereum) {
  window.ethereum.on?.("accountsChanged", () => location.reload());
  window.ethereum.on?.("chainChanged", () => location.reload());
}

/* ---------- writing (gas is paid in GEN from the user's wallet) ---------- */
async function write(fn, args, valueWei) {
  const call = { address: CONTRACT, functionName: fn, args };
  if (valueWei && valueWei > 0n) call.value = valueWei;
  let fees;
  try {
    const e = await walletClient.estimateTransactionFeesForWrite(call);
    fees = { distribution: e.distribution, feeValue: e.feeValue };
  } catch (_) { /* some networks do not need this */ }
  const hash = await walletClient.writeContract(fees ? { ...call, fees } : call);
  const receipt = await walletClient.waitForTransactionReceipt({
    hash, status: "ACCEPTED", waitUntil: "decided", retries: 200, interval: 3000,
  });
  if (GL.isSuccessful && !GL.isSuccessful(receipt)) {
    throw new Error("The contract blocked this action (a rule was not met).");
  }
  return receipt;
}
let busy = false;
async function act(label, fn, args, valueWei) {
  if (!walletClient) return toast("Connect your wallet first (top right).", true);
  if (busy) return toast("Please wait for the current action to finish.", true);
  busy = true;
  toast(label + ": confirm in MetaMask, then wait for the validators (1 to 3 minutes)", false, true);
  try { await write(fn, args, valueWei); toast("Finished: " + label + ". If nothing changed, a rule blocked it."); }
  catch (e) { toast("Failed: " + (e.shortMessage || e.message || e), true); }
  busy = false;
  await updateBalance();
  await refresh();
}

/* ---------- UI helpers ---------- */
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined || kid === false) continue;
    e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return e;
}
const short = a => a.slice(0, 6) + "…" + a.slice(-4);
const badge = s => h("span", { class: "badge " + s }, s);
const fact = (label, value) => h("div", { class: "fact" }, h("small", {}, label), h("div", {}, value));
function safeLink(url) {
  return /^https?:\/\//.test(url)
    ? h("a", { href: url, target: "_blank", rel: "noopener noreferrer", style: "color:#3ea6ff;word-break:break-all" }, url)
    : url;
}
let toastTimer;
function toast(msg, isErr, sticky) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = isErr ? "err" : ""; t.style.display = "block";
  clearTimeout(toastTimer);
  if (!sticky) toastTimer = setTimeout(() => (t.style.display = "none"), 7000);
}
const NOTICE = h("div", { class: "notice" },
  NETWORK === "studionet"
    ? "Test mode: this page is connected to GenLayer Studio, a development environment. Data here can be reset. Validators check real web pages, so actions take 1 to 3 minutes."
    : "Runs on the GenLayer Bradbury testnet. GEN here is testnet GEN with no market value. Gas and funding are paid in GEN from your own wallet. Validators check real web pages, so actions take 1 to 3 minutes, and payouts arrive once the transaction is finalized.");

/* ---------- data ---------- */
const S = { campaigns: [], assist: [], subs: [], parts: [], loaded: false, error: "" };
async function refresh() {
  try {
    const [cc, sc, pc] = await Promise.all([
      read("get_campaign_count"), read("get_submission_count"), read("get_participant_count"),
    ]);
    const idx = n => Array.from({ length: n }, (_, i) => i);
    S.campaigns = await Promise.all(idx(cc).map(i => read("get_campaign", [i]).then(c => ({ id: i, ...c }))));
    S.assist = await Promise.all(idx(cc).map(i => read("get_assistance", [i])));
    S.subs = await Promise.all(idx(sc).map(i => read("get_submission", [i]).then(s => ({ id: i, ...s }))));
    S.parts = await Promise.all(idx(pc).map(i => read("get_participant", [i])));
    S.error = ""; S.loaded = true;
  } catch (e) { S.error = String(e.message || e); }
  render();
}

/* ---------- shared pieces ---------- */
function campaignCard(c) {
  return h("a", { class: "card", href: "#/campaign/" + c.id },
    h("div", { class: "row" }, h("h3", {}, c.title), badge(c.status)),
    h("p", { class: "muted" }, c.description),
    h("p", { class: "meta" }, c.location + " · " + c.event_type),
    h("p", { class: "meta" }, c.start_time + " → " + c.end_time));
}
function funding(c, a) {
  return h("div", { class: "facts" },
    fact("Creator reward pool", "Pool " + gen(c.reward_pool) + " · per approved post " + gen(c.reward_per_submission) + " · paid " + gen(c.paid_out) + " · left " + gen(c.remaining)),
    fact("Community assistance pool (separate)", "Pool " + gen(a.assistance_pool) + " · per claim " + gen(a.assistance_per_claim) + " · paid " + gen(a.assistance_paid) + " · left " + gen(a.assistance_remaining)),
    fact("Disruption verified", a.disruption_verified ? "Yes" : "No"));
}
function pageHead(title, sub) { return [h("h1", {}, title), h("p", { class: "sub" }, sub)]; }
function needWallet() {
  return h("div", { class: "card" }, h("p", {}, "Connect your wallet to use this page."),
    h("button", { onclick: () => connectWallet(false) }, "Connect wallet"));
}

/* ---------- views ---------- */
function viewExplore(root) {
  const n = s => S.campaigns.filter(c => c.status === s).length;
  const stat = (l, v) => h("div", { class: "stat" }, h("b", {}, v), h("span", {}, l));
  const search = h("input", { placeholder: "Search by title, place or event type" });
  const sel = h("select", {}, ["All", "Scheduled", "Active", "Paused", "Completed"].map(s => h("option", {}, s)));
  const list = h("div", { class: "grid" });
  function draw() {
    list.replaceChildren();
    const q = search.value.toLowerCase(), st = sel.value;
    const items = S.campaigns.filter(c =>
      (st === "All" || c.status === st) &&
      (q === "" || (c.title + " " + c.location + " " + c.event_type + " " + c.description).toLowerCase().includes(q)));
    if (!items.length) list.append(h("p", { class: "muted" }, "No campaigns match."));
    items.slice().reverse().forEach(c => list.append(campaignCard(c)));
  }
  search.addEventListener("input", draw); sel.addEventListener("change", draw);
  root.append(...pageHead("Event Explorer", "Campaigns that switch on, pause and settle based on what is happening in the real world."),
    NOTICE,
    h("div", { class: "stats" }, stat("Campaigns", S.campaigns.length), stat("Active", n("Active")), stat("Paused", n("Paused")), stat("Completed", n("Completed"))),
    h("div", { class: "filters" }, search, sel), list);
  draw();
}

function viewCampaign(root, id) {
  const c = S.campaigns[id], a = S.assist[id];
  if (!c) { root.append(h("p", {}, "Campaign not found.")); return; }
  const hist = h("ul", { class: "hist" }, h("li", {}, "Loading history..."));
  read("get_history", [id]).then(items => {
    hist.replaceChildren(...items.slice().reverse().map(t => h("li", {}, t)));
  }).catch(() => hist.replaceChildren(h("li", {}, "Could not load history.")));
  const subs = S.subs.filter(s => s.campaign_id === id);
  const isOwner = ME && c.organizer.toLowerCase() === ME;

  const btn = (label, fn, args) => h("button", { class: "small", onclick: () => act(label, fn, args) }, label);
  const checks = [];
  if (c.status === "Scheduled") checks.push(btn("Check start condition", "evaluate_trigger", [id]));
  if (c.status === "Active") checks.push(btn("Check pause condition", "evaluate_pause", [id]));
  if (c.status === "Paused") checks.push(btn("Check if it can resume", "evaluate_pause", [id]));
  if ((c.status === "Active" || c.status === "Paused") && !a.disruption_verified) checks.push(btn("Verify disruption", "verify_disruption", [id]));

  const amt = h("input", { placeholder: "GEN amount" });
  const fundBtn = (label, fn) => h("button", { class: "small", onclick: () => {
    try { act(label, fn, [id], toWei(amt.value)); } catch (e) { toast(e.message, true); }
  } }, label);
  const panel = h("div", { class: "card" },
    h("p", { class: "meta", style: "margin-top:0" }, "Anyone can run the real-world checks. The validators decide the result, not the organizer."),
    h("div", { class: "actions" }, checks.length ? checks : h("span", { class: "meta" }, "No checks available right now.")),
    c.status !== "Completed" && h("div", { class: "actions" }, amt, fundBtn("Add to creator rewards", "fund_campaign"), fundBtn("Sponsor community assistance", "fund_assistance")),
    isOwner && c.status !== "Completed" && h("div", { class: "actions" },
      h("button", { class: "small", onclick: () => { if (confirm("Complete this campaign and refund all unspent GEN to you?")) act("Complete campaign", "complete_campaign", [id]); } }, "Complete campaign and refund unspent GEN")));

  root.append(
    h("a", { class: "back", href: "#/" }, "← All campaigns"),
    h("div", { class: "row", style: "margin-top:10px" }, h("h1", {}, c.title), badge(c.status)),
    h("p", { class: "sub" }, c.description),
    h("div", { class: "facts" },
      fact("Organizer", short(c.organizer)),
      fact("Where", c.location + " (radius " + c.radius_km + " km)"),
      fact("Campaign window", c.start_time + " → " + c.end_time),
      fact("Event type", c.event_type),
      fact("Evidence source", safeLink(c.evidence_url)),
      fact("Starts when", c.trigger_condition),
      fact("Pauses / counts as disruption when", c.pause_condition),
      fact("Content requirements", c.content_requirements)),
    h("h2", {}, "Funding"), funding(c, a),
    h("h2", {}, "Actions"), panel,
    h("h2", {}, "Decision history"), hist,
    h("h2", {}, "Creator submissions (" + subs.length + ")"),
    subs.length ? h("div", { class: "grid" }, subs.map(s => h("div", { class: "card" },
      h("div", { class: "row" }, safeLink(s.content_url), badge(s.status)),
      s.reason && h("p", { class: "meta" }, s.reason),
      h("p", { class: "meta" }, s.payout_status)))) : h("p", { class: "muted" }, "No submissions yet."));
}

const TEXT_FIELDS = [
  ["title", "Campaign title"], ["description", "Short description"], ["location", "Location / venue"],
  ["start_time", "Start (e.g. 2026-12-01 16:00)"], ["end_time", "End (e.g. 2026-12-01 22:00)"],
  ["event_type", "Event type (weather, concert, match, transport...)"],
  ["trigger_condition", "Start condition (plain English)"],
  ["pause_condition", "Pause / disruption condition (plain English)"],
  ["content_requirements", "Content requirements for creators"],
  ["evidence_url", "Evidence web page (public link)"],
];
const NUM_FIELDS = [
  ["radius_km", "Radius (km)"],
  ["reward_pool", "Creator reward pool (GEN you deposit)"],
  ["assistance_pool", "Community assistance pool (GEN you deposit)"],
  ["reward_per_submission", "Reward per approved post (GEN)"],
  ["assistance_per_claim", "Assistance per claim (GEN)"],
];
const EXAMPLE = {
  title: "Lagos Test Campaign", description: "Test campaign", location: "Lagos", radius_km: "5",
  start_time: "2026-12-01 16:00", end_time: "2026-12-01 22:00", event_type: "general",
  trigger_condition: "The page states that Lagos is a city in Nigeria", pause_condition: "The page mentions Nigeria",
  content_requirements: "The content must be about Lagos, Nigeria", evidence_url: "https://en.wikipedia.org/wiki/Lagos",
  reward_pool: "0.5", assistance_pool: "0.3", reward_per_submission: "0.1", assistance_per_claim: "0.05",
};

function viewBrand(root) {
  const inputs = {};
  const all = [...TEXT_FIELDS.map(f => [...f, "text"]), ...NUM_FIELDS.map(f => [...f, "text"])];
  const form = h("div", { class: "form" }, all.map(([k, label, type]) => {
    inputs[k] = h("input", { type, placeholder: label });
    return h("div", {}, h("label", {}, label), inputs[k]);
  }));
  const create = () => {
    try {
      for (const [k] of all) if (inputs[k].value.trim() === "") throw new Error("Please fill every field.");
      const v = k => inputs[k].value.trim();
      const radius = Number(v("radius_km"));
      if (!Number.isInteger(radius) || radius < 0) throw new Error("Radius must be a whole number.");
      const rewardPool = toWei(v("reward_pool")), assistPool = toWei(v("assistance_pool"));
      const perPost = toWei(v("reward_per_submission")), perClaim = toWei(v("assistance_per_claim"));
      const total = rewardPool + assistPool;
      if (total <= 0n) throw new Error("Deposit some GEN into the pools.");
      if (!confirm("You will send " + gen(total.toString()) + " into this campaign, plus gas. Continue?")) return;
      act("Create campaign", "create_campaign", [
        v("title"), v("description"), v("location"), radius, v("start_time"), v("end_time"),
        v("event_type"), v("trigger_condition"), v("pause_condition"), v("content_requirements"),
        perPost, assistPool, perClaim, v("evidence_url"),
      ], total);
    } catch (e) { toast(e.message, true); }
  };
  const fill = () => all.forEach(([k]) => (inputs[k].value = EXAMPLE[k]));
  const mine = ME ? S.campaigns.filter(c => c.organizer.toLowerCase() === ME).reverse() : [];
  root.append(...pageHead("Brand dashboard", "Fund an event-triggered campaign. Your GEN is held by the contract and paid out by the rules."), NOTICE,
    ME ? h("div", {}, h("h2", {}, "Create a campaign"), form,
      h("div", { class: "actions" }, h("button", { onclick: create }, "Create and fund campaign"), h("button", { onclick: fill }, "Fill test example")))
       : needWallet(),
    h("h2", {}, "My campaigns"),
    mine.length ? h("div", { class: "grid" }, mine.map(campaignCard)) : h("p", { class: "muted" }, ME ? "You have not created any campaigns yet." : "Connect your wallet to see your campaigns."));
}

function viewCreator(root) {
  const active = S.campaigns.filter(c => c.status === "Active");
  const sel = h("select", {}, active.map(c => h("option", { value: c.id }, c.title)));
  const url = h("input", { placeholder: "Link to your content (a public web page)" });
  const submit = () => {
    if (!active.length) return toast("No active campaigns right now.", true);
    if (!url.value.trim()) return toast("Paste a link first.", true);
    act("Submit content", "submit_content", [Number(sel.value), url.value.trim()]);
  };
  const mine = !ME ? [] : S.subs.filter(s => s.creator.toLowerCase() === ME).reverse().map(s => {
    const c = S.campaigns[s.campaign_id];
    const note = h("input", { placeholder: "Why was this rejection wrong?" });
    return h("div", { class: "card" },
      h("div", { class: "row" }, h("h3", {}, c ? c.title : "Campaign " + s.campaign_id), badge(s.status)),
      h("p", { class: "meta" }, safeLink(s.content_url)),
      s.reason && h("p", { class: "meta" }, "Reviewer: " + s.reason),
      h("p", { class: "meta" }, s.payout_status),
      s.dispute_status !== "none" && h("p", { class: "meta" }, "Dispute " + s.dispute_status + ": " + s.dispute_result),
      s.status === "Pending" && h("div", { class: "actions" }, h("button", { class: "small", onclick: () => act("Review submission", "evaluate_submission", [s.id]) }, "Get it reviewed")),
      s.status === "Rejected" && s.dispute_status === "none" && h("div", { class: "actions" }, note,
        h("button", { class: "small", onclick: () => note.value.trim() ? act("Dispute rejection", "dispute_submission", [s.id, note.value.trim()]) : toast("Write a short note.", true) }, "Dispute")));
  });
  root.append(...pageHead("Creator dashboard", "Submit content to active campaigns. Approved posts are paid in GEN straight to your wallet."), NOTICE,
    !ME ? needWallet() : h("div", {},
      h("h2", {}, "Submit content"),
      active.length ? h("div", { class: "form" }, h("div", {}, h("label", {}, "Campaign"), sel), h("div", {}, h("label", {}, "Content link"), url)) : h("p", { class: "muted" }, "No campaigns are active right now."),
      active.length && h("div", { class: "actions" }, h("button", { onclick: submit }, "Submit")),
      h("h2", {}, "My submissions"),
      mine.length ? h("div", { class: "grid" }, mine) : h("p", { class: "muted" }, "You have not submitted anything yet.")));
}

function viewCommunity(root) {
  const open = S.campaigns.filter(c => c.status !== "Completed").reverse();
  const cards = open.map(c => {
    const a = S.assist[c.id];
    const me = ME && S.parts.find(p => p.campaign_id === c.id && p.wallet.toLowerCase() === ME);
    let action;
    if (!ME) action = h("span", { class: "meta" }, "Connect your wallet to register.");
    else if (!me && !a.disruption_verified) action = h("button", { class: "small", onclick: () => act("Register", "register_participant", [c.id]) }, "Register for this campaign");
    else if (!me) action = h("span", { class: "meta" }, "Registration closed: a disruption was already verified.");
    else if (me.claimed) action = h("span", { class: "meta" }, me.note);
    else if (a.disruption_verified) action = h("button", { class: "small", onclick: () => act("Claim assistance", "claim_assistance", [c.id]) }, "Claim assistance");
    else action = h("span", { class: "meta" }, "You are registered. Assistance opens if a disruption is verified.");
    return h("div", { class: "card" },
      h("div", { class: "row" }, h("h3", {}, h("a", { href: "#/campaign/" + c.id, style: "color:inherit" }, c.title)), badge(c.status)),
      h("p", { class: "meta" }, c.location + " · disruption rule: " + c.pause_condition),
      h("p", { class: "meta" }, "Assistance per claim " + gen(a.assistance_per_claim) + " · left " + gen(a.assistance_remaining) + " (sponsor-funded)"),
      h("div", { class: "actions" }, action));
  });
  root.append(...pageHead("Community protection", "Register before an event. If a disruption is verified, registered people can claim sponsor-funded assistance in GEN."), NOTICE,
    cards.length ? h("div", { class: "grid" }, cards) : h("p", { class: "muted" }, "No open campaigns."));
}

/* ---------- router ---------- */
function render() {
  const parts = location.hash.replace(/^#\/?/, "").split("/");
  const page = parts[0] === "" ? "explore" : parts[0];
  document.getElementById("nav").replaceChildren(
    ...[["explore", "#/", "Explore"], ["brand", "#/brand", "Brand"], ["creator", "#/creator", "Creator"], ["community", "#/community", "Community"]]
      .map(([k, href, label]) => h("a", { href, class: (page === k || (page === "campaign" && k === "explore")) ? "on" : "" }, label)));
  document.getElementById("acct").replaceChildren(
    ME ? h("span", {}, short(ME) + (balance ? " · " + balance : ""))
       : h("button", { class: "small", onclick: () => connectWallet(false) }, "Connect wallet"));
  const root = document.getElementById("main");
  root.replaceChildren();
  if (CONTRACT.startsWith("PASTE")) {
    root.append(h("div", { class: "card" }, h("h3", {}, "Almost ready"), h("p", { class: "muted" }, "Open index.html and paste your deployed contract address into the CONTRACT setting near the top of the script.")));
    return;
  }
  if (S.error) { root.append(h("p", { style: "color:#ff7b7b" }, "Could not load: " + S.error)); return; }
  if (!S.loaded) { root.append(h("p", { class: "muted" }, "Loading from GenLayer...")); return; }
  if (page === "campaign") viewCampaign(root, Number(parts[1]));
  else if (page === "brand") viewBrand(root);
  else if (page === "creator") viewCreator(root);
  else if (page === "community") viewCommunity(root);
  else viewExplore(root);
}
window.addEventListener("hashchange", render);
render();
if (!CONTRACT.startsWith("PASTE")) { connectWallet(true); refresh(); }
</script>
</body>
</html>
