<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Locora</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f1720; color: #e8eef5; margin: 0; }
    main { max-width: 720px; margin: 0 auto; padding: 24px; }
    h1 { margin-bottom: 4px; }
    .sub { color: #8fa3b8; margin-top: 0; margin-bottom: 24px; }
    .card { background: #17212d; border: 1px solid #263445; border-radius: 10px; padding: 16px; margin-bottom: 14px; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .card h2 { margin: 0; font-size: 20px; }
    .badge { font-size: 13px; padding: 3px 10px; border-radius: 999px; background: #33414f; }
    .Active { background: #1f6f43; }
    .Paused { background: #8a6d1a; }
    .Completed { background: #1d4f8a; }
    .meta { color: #8fa3b8; font-size: 14px; margin: 6px 0 0; }
    #status { color: #8fa3b8; }
    .error { color: #ff7b7b; }
  </style>
</head>
<body>
  <main>
    <h1>Locora</h1>
    <p class="sub">Campaigns that respond to what is happening in the real world.</p>
    <p id="status">Loading campaigns...</p>
    <div id="list"></div>
  </main>

  <script type="module">
    import { createClient } from "https://esm.sh/genlayer-js";
    import { studionet } from "https://esm.sh/genlayer-js/chains";

    const CONTRACT = "0x5D33abF3dA49bEC57D35A4D07e9b12E4A0832cd4";
    const client = createClient({ chain: studionet });

    // Turns BigInts and Maps from the contract into normal values
    function plain(v) {
      if (typeof v === "bigint") return Number(v);
      if (v instanceof Map) {
        const o = {};
        for (const [k, val] of v.entries()) o[k] = plain(val);
        return o;
      }
      if (Array.isArray(v)) return v.map(plain);
      if (v && typeof v === "object") {
        const o = {};
        for (const k of Object.keys(v)) o[k] = plain(v[k]);
        return o;
      }
      return v;
    }

    async function read(functionName, args = []) {
      const result = await client.readContract({
        address: CONTRACT,
        functionName,
        args,
      });
      return plain(result);
    }

    function el(tag, className, text) {
      const e = document.createElement(tag);
      if (className) e.className = className;
      if (text !== undefined) e.textContent = text;
      return e;
    }

    async function load() {
      const status = document.getElementById("status");
      const list = document.getElementById("list");
      try {
        const count = await read("get_campaign_count");
        if (count === 0) {
          status.textContent = "No campaigns yet.";
          return;
        }
        status.textContent = "";
        for (let i = 0; i < count; i++) {
          const c = await read("get_campaign", [i]);
          const card = el("div", "card");
          const row = el("div", "row");
          row.appendChild(el("h2", "", c.title));
          row.appendChild(el("span", "badge " + c.status, c.status));
          card.appendChild(row);
          card.appendChild(el("p", "meta", c.description));
          card.appendChild(el("p", "meta", c.location + " · " + c.event_type + " · " + c.start_time + " to " + c.end_time));
          card.appendChild(el("p", "meta", "Reward pool remaining (simulated): " + c.remaining));
          list.appendChild(card);
        }
      } catch (e) {
        status.className = "error";
        status.textContent = "Could not load: " + e;
      }
    }

    load();
  </script>
</body>
</html>
